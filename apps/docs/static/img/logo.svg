<!-- The mark is the name: three crests that also read as the rise and fall of a
     balance, with one crest carrying the accent — the balance that is yours.
     A navbar logo is an <img>, so currentColor cannot follow the theme; the
     dark twin lives in logo-dark.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 18" width="26" height="18" fill="none">
  <path d="M1 12.2c1.9 0 1.9-4.1 3.8-4.1s1.9 4.1 3.8 4.1 1.9-4.1 3.8-4.1 1.9 4.1 3.8 4.1 1.9-4.1 3.8-4.1 1.9 4.1 3.8 4.1" stroke="#17181B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12.6 8.1c1.9 0 1.9 4.1 3.8 4.1" stroke="#5638C4" stroke-width="1.9" stroke-linecap="round"/>
</svg>
