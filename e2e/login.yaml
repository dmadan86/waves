# Reusable sign-in preamble.
#
# The other flows `runFlow: login.yaml` first so they open on a real, seeded,
# signed-in dashboard rather than the sign-in wall. Without this, `clearState`
# lands on `/welcome` and every "assertVisible: Goa trip" fails — which is why
# the flows never actually passed.
#
# Credentials come from the Maestro env, matching the account e2e/seed-e2e.mjs
# creates:  maestro test --env E2E_EMAIL=… --env E2E_PASSWORD=… e2e/
#
# The login screen is a single white sheet now (no "Continue with email" step):
# tapping "Sign in" on the welcome gateway lands straight on the email +
# password form. The final tap targets the submit button by its testID
# (`auth-submit`) because the screen carries the word "Sign in" three times —
# the heading, the submit button, and the "Sign in with …" providers.
appId: app.waves.mobile
---
- launchApp:
    clearState: true

# /welcome → /sign-in, straight onto the white email + password sheet.
- tapOn: 'Sign in'
- tapOn: 'Email or phone number'
- inputText: '${E2E_EMAIL}'
- tapOn: 'Password'
- inputText: '${E2E_PASSWORD}'
- hideKeyboard
- tapOn:
    id: 'auth-submit'

# A fresh sign-in (clearState) always meets the one-time intro tour before the
# app proper. Skip it by testID; optional so an account that has seen it passes.
- extendedWaitUntil:
    visible:
      id: 'intro-skip'
    timeout: 60000
    optional: true
- tapOn:
    id: 'intro-skip'
    optional: true

# The dashboard appears once the first sync has pulled the seeded group. Give it
# room — a cold sign-in does an auth round-trip and a full cursor pull.
# KNOWN APP BUG: skipping the intro occasionally blanks the app (Fabric
# "addViewAt: failed to insert view [614] into parent [76]" in logcat, JS never
# recovers). The tour is already marked seen by then, so relaunching without
# clearing state lands on the dashboard. Remove once the app is fixed.
- extendedWaitUntil:
    visible: 'Your groups'
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: 'Your groups'
    commands:
      - launchApp
- extendedWaitUntil:
    visible: 'Your groups'
    timeout: 40000
- extendedWaitUntil:
    visible: 'Goa trip'
    timeout: 40000
