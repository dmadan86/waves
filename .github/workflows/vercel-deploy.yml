name: Vercel deploy (manual)

# Vercel's git integration is turned off (git.deploymentEnabled: false in each
# project's vercel.json), so no push or PR ever creates a deployment. This workflow
# is the only way a deploy happens: run it by hand from the Actions tab, pick
# the project (web / admin / website / docs / api / all) and the target
# (preview / production).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN              — a Vercel access token
#   VERCEL_ORG_ID             — the Vercel team/org id (same for every project)
#   VERCEL_PROJECT_ID_WEB     — project id of waves-web     (.vercel/project.json)
#   VERCEL_PROJECT_ID_ADMIN   — project id of waves-admin   (.vercel/project.json)
#   VERCEL_PROJECT_ID_WEBSITE — project id of waves         (.vercel/project.json)
#   VERCEL_PROJECT_ID_DOCS    — project id of waves-docs    (.vercel/project.json)
#   VERCEL_PROJECT_ID_API     — project id of waves-api     (.vercel/project.json)

on:
  workflow_dispatch:
    inputs:
      project:
        description: Which app to deploy
        type: choice
        default: all
        options:
          - web
          - admin
          - website
          - docs
          - api
          - all
      target:
        description: Deployment environment
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.project }}-${{ github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ matrix.app }} (${{ github.event.inputs.target }})
    runs-on: ubuntu-latest
    strategy:
      # One deploy per selected app. `all` fans out to every project; naming a
      # single app filters the matrix down to just that entry. fail-fast off so
      # one failing project does not cancel the others.
      fail-fast: false
      matrix:
        app: [web, admin, website, docs, api]
        # One exclude per project, each reading "drop this app unless it was the
        # one asked for, or the answer was `all`". Naming every other app in
        # every line, which is what this was, needed a new clause in every line
        # each time a project was added.
        exclude:
          - app: ${{ (github.event.inputs.project != 'all' && github.event.inputs.project != 'web') && 'web' || 'nothing' }}
          - app: ${{ (github.event.inputs.project != 'all' && github.event.inputs.project != 'admin') && 'admin' || 'nothing' }}
          - app: ${{ (github.event.inputs.project != 'all' && github.event.inputs.project != 'website') && 'website' || 'nothing' }}
          - app: ${{ (github.event.inputs.project != 'all' && github.event.inputs.project != 'docs') && 'docs' || 'nothing' }}
          - app: ${{ (github.event.inputs.project != 'all' && github.event.inputs.project != 'api') && 'api' || 'nothing' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # Every app names its own secret and the chain ends in an empty string.
      #
      # It used to end in VERCEL_PROJECT_ID_WEB, and `a && b || c` in this
      # expression language falls through whenever `b` is falsy — which an unset
      # secret is. So an app whose project id had not been created yet did not
      # fail: it silently borrowed the web app's project, and `vercel deploy`
      # run from that app's directory would have published it over the live web
      # app. The guard below turns the empty string into a stopped run.
      VERCEL_PROJECT_ID: ${{ matrix.app == 'web' && secrets.VERCEL_PROJECT_ID_WEB || matrix.app == 'admin' && secrets.VERCEL_PROJECT_ID_ADMIN || matrix.app == 'website' && secrets.VERCEL_PROJECT_ID_WEBSITE || matrix.app == 'docs' && secrets.VERCEL_PROJECT_ID_DOCS || matrix.app == 'api' && secrets.VERCEL_PROJECT_ID_API || '' }}
      # The marketing site sits at the repo root, the rest under apps/.
      APP_DIR: ${{ matrix.app == 'website' && 'website' || format('apps/{0}', matrix.app) }}
    steps:
      - name: This app must have a project id of its own
        run: |
          if [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "::error::No Vercel project id for '${{ matrix.app }}'. Create the project, run 'vercel link' in ${APP_DIR}, and add the id from .vercel/project.json as the VERCEL_PROJECT_ID_$(echo '${{ matrix.app }}' | tr '[:lower:]' '[:upper:]') repository secret."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install the Vercel CLI
        run: npm i -g vercel@latest

      # vercel pull reads VERCEL_ORG_ID / VERCEL_PROJECT_ID from the env above to
      # fetch that project's settings. --prod when deploying to production so the
      # right environment variables are pulled and built.
      - name: Pull Vercel project settings
        working-directory: ${{ env.APP_DIR }}
        run: vercel pull --yes --environment=${{ github.event.inputs.target == 'production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      # Which half of this an app takes is decided by whether it imports a
      # workspace package, not by where it sits.
      #
      # `web`, `admin` and `api` import @waves/core, so they are built here —
      # from the repository root, where the workspace resolves — and the
      # finished output is uploaded.
      #
      # `website` and `docs` import nothing from the workspace. They also
      # cannot be built here: every dependency is a symlink into a store at the
      # repository root, and `vercel build` run inside their directory packages
      # nothing above it. The upload then fails on a file that exists — just not
      # underneath that directory — ("Please ensure project dependencies have
      # been installed"). Building on Vercel instead installs from their own
      # package.json, which resolves on its own.
      - name: Build
        if: matrix.app == 'web' || matrix.app == 'admin' || matrix.app == 'api'
        working-directory: ${{ env.APP_DIR }}
        run: vercel build ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        if: matrix.app == 'web' || matrix.app == 'admin' || matrix.app == 'api'
        working-directory: ${{ env.APP_DIR }}
        run: vercel deploy --prebuilt ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (built on Vercel)
        if: matrix.app == 'website' || matrix.app == 'docs'
        working-directory: ${{ env.APP_DIR }}
        run: vercel deploy ${{ github.event.inputs.target == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
