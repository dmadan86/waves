# Maestro flow: buy Pro through RevenueCat's Test Store.
#
# Paywall opened from the dashboard menu, plans load with prices, Monthly/Yearly
# switch (all in paywall-open.yaml), then: Continue with Pro →
# complete the Test Store purchase dialog → the app says Pro is active.
#
# NEEDS (see paywall-open.yaml): the DEBUG build `app.waves.mobile.debug` built
# with the RevenueCat TEST STORE public key in EXPO_PUBLIC_REVENUECAT_ANDROID_KEY,
# the `paywall` flag on, and a FREE account. A Test Store purchase is a real
# purchase as far as RevenueCat is concerned, so this account is Pro afterwards:
# run paywall-cancel.yaml first (it leaves the account free), and use a fresh
# E2E_EMAIL, or wait for the Test Store subscription to lapse, before running this
# one again.
#
# The Test Store dialog is RevenueCat's own, not Waves', and its wording is not
# ours to pin. It is a system dialog with a "valid purchase" button, a "failed
# purchase" button and a "Cancel" button. Selectors are therefore case-insensitive
# regexes on the part that matters ("valid" / "purchase"), and the tap is
# optional-chained over the variants we have seen, so a reworded dialog fails at
# the "Welcome to Waves Pro" / "Current plan" assertion below rather than on a
# selector nobody remembers choosing.
#
#   maestro test --env E2E_EMAIL=… --env E2E_PASSWORD=… e2e/paywall-purchase.yaml
appId: app.waves.mobile.debug
---
- runFlow: paywall-open.yaml

# Buy Pro (the button reads "Continue with Pro").
- tapOn: 'Continue with Pro'

# --- RevenueCat Test Store purchase dialog -------------------------------------
- extendedWaitUntil:
    visible: '(?i).*(test|valid).*purchase.*'
    timeout: 20000
# Preferred wording first, then looser fallbacks; only one of them is on screen.
- tapOn:
    text: '(?i).*test valid purchase.*'
    optional: true
- tapOn:
    text: '(?i).*valid purchase.*'
    optional: true
- tapOn:
    text: '(?i)^(buy|purchase|subscribe|confirm)$'
    optional: true
# --------------------------------------------------------------------------------

# Success: a toast, then the paywall closes back to the dashboard. The toast is
# brief, so it is optional; the dashboard and the re-opened paywall are the proof.
- assertVisible:
    text: 'Welcome to Waves Pro.'
    optional: true
- extendedWaitUntil:
    visible: 'Your groups'
    timeout: 30000

# Pro is active: the paywall now marks it as the current plan, and the button
# for it is disabled with "You are on Waves Pro."
- tapOn: 'Settings'
- tapOn: 'Upgrade'
- extendedWaitUntil:
    visible: 'Pro, .*[0-9].*/mo.*'
    timeout: 20000
- tapOn: 'Pro, .*[0-9].*/mo.*'
- assertVisible: 'You are on Waves Pro.'
- assertVisible: 'Current plan'
- assertNotVisible: 'That did not go through.*'
