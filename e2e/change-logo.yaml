# Changing a group's icon commits on Done (F-CFG-02). Reopening the
# cover sheet must load the saved icon rather than the previous draft.
appId: app.waves.mobile
---
- runFlow: login.yaml

- tapOn: 'Goa trip'
- tapOn: 'Group settings'
- tapOn: 'Group cover'
- assertVisible: '1. Choose an icon'
- tapOn: 'See all'
- tapOn: 'Search icons'
- inputText: 'Camping'
- hideKeyboard
- tapOn: 'Camping'
- tapOn: 'Done'

# Done closes the editor. Reopen it to verify the committed selection.
- assertNotVisible: 'Search icons'
- assertVisible: 'Edit group'
- tapOn: 'Group cover'
- tapOn: 'See all'
- tapOn: 'Search icons'
- inputText: 'Camping'
- hideKeyboard
- assertVisible:
    text: 'Camping'
    selected: true
- tapOn: 'Close'
