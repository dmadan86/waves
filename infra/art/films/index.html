<!doctype html><html><head><meta charset="utf-8">
<!-- Square feature films (1080x1080, 8s). Each film is a pure function of time:
     window.seek(t) paints frame t. Render with `node render.mjs <film>`. -->
<style>
@font-face{font-family:OG;src:url(fonts/OverusedGrotesk-VF.woff2);font-weight:100 900}
@font-face{font-family:PJS;src:url(fonts/PlusJakartaSans-Medium.ttf);font-weight:500}
@font-face{font-family:PJS;src:url(fonts/PlusJakartaSans-Bold.ttf);font-weight:700}
@font-face{font-family:PJS;src:url(fonts/PlusJakartaSans-ExtraBold.ttf);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F3F1FB;overflow:hidden}
#stage{position:relative;width:1080px;height:1080px;overflow:hidden;background:#F1EFFB;font-family:PJS,sans-serif;color:#14142B}
.abs{position:absolute}
.word{position:absolute;left:70px;font-family:OG,sans-serif;font-weight:700;letter-spacing:-.035em;font-size:78px;line-height:1}
.big{position:absolute;left:70px;font-family:OG,sans-serif;font-weight:700;letter-spacing:-.03em;font-size:92px;color:#7A5AF8;font-variant-numeric:tabular-nums}
.phone{position:absolute;width:412px;height:866px;border:11px solid #14142B;border-radius:62px;background:#14142B;box-shadow:0 30px 60px rgba(20,20,43,.22);transform-origin:0 0}
.scr{position:absolute;left:0;top:0;width:390px;height:844px;border-radius:51px;overflow:hidden;background:#F3F1FB}
.page{position:absolute;left:0;top:0;width:330px;height:715px;padding:50px 14px 0;zoom:1.18}
.sb{position:absolute;left:0;top:0;width:390px;height:44px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:800;z-index:30}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(60,40,140,.07)}
.lbl{font-size:12px;font-weight:700;color:#7B7B8F}
.muted{color:#7B7B8F}
.num{font-variant-numeric:tabular-nums}
.finger{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(20,20,43,.28);border:2px solid rgba(255,255,255,.9);z-index:50}
.ring{position:absolute;border-radius:50%;border:3px solid #7A5AF8;transform:translate(-50%,-50%);z-index:49}
</style></head><body><div id="stage"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, d) => clamp((t - a) / d);
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const DUR = 8, ACC = '#7A5AF8', INK = '#14142B', FAINT = '#CBC4EE';
// A tap in screen coordinates: the finger glides in, presses, a ring spreads.
function finger(t, at, x, y) {
  if (t < at - 1 || t > at + .9) return '';
  const a = eio(seg(t, at - .9, .9)), pr = t > at ? 1 - .25 * Math.sin(Math.PI * seg(t, at, .4)) : 1, op = Math.min(1, seg(t, at - 1, .25)) * (1 - seg(t, at + .45, .35)), rp = seg(t, at, .6);
  return `<div class="ring" style="left:${x}px;top:${y}px;width:${rp * 90}px;height:${rp * 90}px;opacity:${rp > 0 && rp < 1 ? 1 - rp : 0}"></div><div class="finger" style="left:${x + (1 - a) * 50 - 22}px;top:${y + (1 - a) * 80 - 22}px;transform:scale(${pr});opacity:${op}"></div>`;
}
const sb = `<div class="sb"><span>9:41</span><span style="display:flex;gap:5px;align-items:center"><i style="width:16px;height:10px;background:${INK};border-radius:3px"></i><i style="width:24px;height:11px;border:2px solid ${INK};border-radius:4px"></i></span></div>`;
const phone = inner => `<div class="phone" style="left:548px;top:24px;transform:scale(1.195)"><div class="scr">${inner}${sb}</div></div>`;
// Left column: the step words, the active one in ink, and one big figure.
function words(t, list, beats) {
  return list.map((w, i) => { const on = t >= beats[i][0] && t < beats[i][1]; const k = on ? eo(seg(t, beats[i][0], .3)) : 0;
    return `<div class="word" style="top:${110 + i * 92}px;color:${on ? INK : FAINT};transform:translateX(${k * 0}px)">${w}</div>`; }).join('');
}
function big(t, items) { // items: [start, end, value(t)]
  return items.map(([a, b, v]) => { if (t < a || t >= b) return ''; const k = eo(seg(t, a, .35)), out = seg(t, b - .3, .3);
    return `<div class="big num" style="top:${560 + (1 - k) * 24}px;opacity:${k * (1 - out)}">${v(t)}</div>`; }).join('');
}
// Typed text with a caret while typing.
const typed = (t, at, s, cps = 8) => { const n = Math.floor(clamp((t - at) * cps, 0, s.length)); return s.slice(0, n) + (t > at - .3 && t < at + s.length / cps + .4 ? `<i style="display:inline-block;width:2px;height:22px;background:${ACC};vertical-align:middle;margin-left:1px"></i>` : ''); };
const count = (t, at, d, to) => inr(to * eo(seg(t, at, d)));
// Loop seam: the last .5s slides the opening frame back in from the right.
const SEAM = 7.5;
function seek(t) {
  const main = FILM(t), first = FILM(0), k = eio(seg(t, SEAM, DUR - SEAM));
  document.getElementById('stage').innerHTML = k > 0
    ? `<div class="abs" style="inset:0;transform:translateX(${-k * 1080}px)">${main}</div><div class="abs" style="inset:0;transform:translateX(${(1 - k) * 1080}px)">${first}</div>`
    : main;
}
window.seek = seek;
document.write(`<script src="${new URLSearchParams(location.search).get('film')}.js"><\/script>`);
</script>
<script>document.fonts.ready.then(() => { seek(0); window.ready = true; });</script>
</body></html>
