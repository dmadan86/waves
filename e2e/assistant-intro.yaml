# Sub-flow (do not run it alone): the one-time "I'll ask one or two quick
# things" card sits above the first follow-up of a fresh install. Every flow
# starts from clearState, so every flow meets it once; this dismisses it when it
# is there. assistant-intro-once.yaml is the flow that asserts the card itself.
appId: app.waves.mobile
---
- runFlow:
    when:
      visible: "I'll ask one or two quick things.*"
    commands:
      - tapOn: 'Got it'
