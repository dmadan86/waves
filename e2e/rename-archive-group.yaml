# Renaming a group persists, and archiving removes it from Home (F-CFG-01 /
# F-CFG-04). Uses the seeded "Goa trip".
appId: app.waves.mobile
---
- runFlow: login.yaml

- tapOn: 'Goa trip'
- tapOn: 'Group settings'
- tapOn: 'Edit group'
- assertVisible: 'Changes save automatically'

# Done commits the name and closes the sheet.
- tapOn: 'Goa trip'
- eraseText: 30
- inputText: 'Goa 2026'
- hideKeyboard
- tapOn: 'Done'

# Verify persistence outside the input before checking removal.
- tapOn: 'Back'
- assertVisible: 'Goa 2026'

# Archive it from settings — the row sits below, past the roster.
- tapOn: 'Group settings'
- tapOn: 'Archive, leave or delete'
- scrollUntilVisible:
    element: 'Archive group'
    direction: DOWN
- tapOn: 'Archive group'
- assertVisible: 'Archive this group?'
- tapOn: 'Archive'

# Back on Home, the renamed group is gone from the list.
- assertVisible: 'Your groups'
- assertNotVisible: 'Goa 2026'
