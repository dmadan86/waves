# Weekly dependency PRs. The CI `security` job blocks a merge on a high-severity
# advisory in production code; this is the other half — the routine bumps that
# keep us off those advisories in the first place, across the workspace and the
# GitHub Actions we pin.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces use the npm ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # React Native is pinned by the Expo SDK, not by us, and its 0.x numbering
    # makes a breaking release look like a minor one — so it lands in the
    # "routine noise" group and is merged on a green CI that cannot see the
    # problem. This has already happened once: 0.86 to 0.87 went in as #199 and
    # came straight back out as #200, because Expo SDK 57 cannot build it
    # natively (AGP/Kotlin/Gradle break the autolinking plugin, and worklets
    # 0.12 breaks reanimated 4.5.3). CI is JS-only, so nothing caught it until
    # somebody ran `gradlew`.
    #
    # These move when the Expo SDK moves, deliberately and with an APK built to
    # prove it. `expo install --check` is the tool for that, not Dependabot.
    #
    # The same is true of every native module the SDK pins. Dependabot proposed
    # reanimated 4.6.0 in #764: green CI, and a peer range of `react-native-worklets:
    # 0.12.x` against the 0.10.1 the SDK gives us. Nothing in a JS test run can see
    # that, and the first symptom is a build on somebody's machine.
    ignore:
      - dependency-name: react-native
      - dependency-name: react-native-worklets
      - dependency-name: '@react-native/*'
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-screens
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-svg
      - dependency-name: react-native-maps
      - dependency-name: '@react-native-community/datetimepicker'
      # And the SDK's own packages, for the same reason one layer up. On
      # 2026-09-18 Dependabot opened seven PRs moving `expo-*` modules to 58.x
      # while `expo` itself sat at 57.0.24 — because **there is no Expo SDK 58**:
      # `expo@latest` is 57, and 58 exists only as `canary`. Each PR was green,
      # and together they put six major-ahead native modules into the app plus a
      # duplicate `expo-application` (57 from expo-auth-session, 58 from
      # expo-notifications) — which `expo-doctor` calls out and a JS test run
      # cannot see.
      #
      # Majors only. Patch and minor bumps inside the SDK's line are exactly the
      # routine noise this file is for, and `expo install --fix` wants them.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
    groups:
      # One PR for the routine patch/minor noise instead of dozens; majors still
      # come as their own reviewable PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
